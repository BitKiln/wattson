[workspace]
resolver = "3"
members = ["protocol/rust", "core", "simulator", "cli"]
exclude = ["desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wattson-profiler/wattson"
homepage = "https://github.com/wattson-profiler/wattson"
authors = ["Wattson contributors"]

[workspace.dependencies]
wattson-protocol = { path = "protocol/rust", version = "0.1.0" }
wattson-core = { path = "core", version = "0.1.0" }
wattson-sim = { path = "simulator", version = "0.1.0" }

cobs = { version = "0.4", default-features = false }
crc = "3"
thiserror = "2"
anyhow = "1"
serialport = "4"
crossbeam-channel = "0.5"
zstd = "0.13"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand_chacha = "0.9"
rand_core = "0.9"
jiff = "0.2"
zerocopy = { version = "0.8", features = ["derive"] }
ctrlc = "3"

proptest = "1"
insta = { version = "1", features = ["json"] }
criterion = "0.5"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
approx = "0.5"
rstest = "0.23"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.zstd-sys]
opt-level = 3
