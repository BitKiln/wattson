name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, for the fuzz soak.
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      # udev is required by `serialport` for device enumeration on Linux.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: matrix.rust == 'stable'
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      # The protocol crate is what phase-2 firmware links. If it stops building without std,
      # firmware support has silently broken.
      - name: Protocol builds without std
        run: cargo build -p wattson-protocol --no-default-features

  embedded:
    name: protocol links on a Cortex-M0+
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      # This one line is the guarantee that RP2040 firmware can actually use this crate.
      - name: Build protocol for thumbv6m-none-eabi
        run: cargo build -p wattson-protocol --no-default-features --target thumbv6m-none-eabi

  # The decoder eats untrusted bytes off a USB device and the reader eats untrusted files, so
  # both are fuzzed. Nightly rather than per-PR: fuzzing is a soak, not a gate.
  fuzz:
    name: fuzz (nightly schedule only)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - run: cargo install cargo-fuzz
      - run: cargo fuzz run decoder -- -max_total_time=300
        working-directory: .
      - run: cargo fuzz run capture_reader -- -max_total_time=300
        working-directory: .

  deny:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
