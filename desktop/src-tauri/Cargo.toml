# Excluded from the workspace on purpose: `cargo build --workspace` must stay green without
# `npm install` and a webview toolchain. Build it with `cargo tauri dev` from `desktop/`.
[package]
name = "wattson-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Wattson desktop app: synchronised current, voltage and firmware-event timelines"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wattson-core = { path = "../../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
